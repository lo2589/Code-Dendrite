# dsh-cdd-lens-pcb — host entry.
#
# The `id` below is the name the client half must answer to. The loader pairs a
# client module to a mounted host entry by ENTRY ID, not by package name:
# `dsh-cdd-lens-pcb` is the package, `cdd-lens-pcb` is the entry, and a mismatch loads
# the module, pairs it to nothing, and never calls apply — no error anywhere,
# and no panel.
- insert:
    - id: cdd-lens-pcb
      name: dsh-cdd-lens-pcb
      config: {}
